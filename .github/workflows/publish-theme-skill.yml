name: Publish theme development Skill

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm package version, for example 0.1.0"
        required: true
        type: string
  push:
    tags:
      - "theme-skill-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build validator (${{ matrix.key }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            key: darwin-arm64
            executable: retheme-theme-validator
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            key: darwin-x64
            executable: retheme-theme-validator
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            key: win32-x64
            executable: retheme-theme-validator.exe
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            key: linux-x64
            executable: retheme-theme-validator
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build validator
        shell: bash
        run: cargo build --release --locked --manifest-path crates/theme-validator/Cargo.toml --target "${{ matrix.target }}"
      - name: Stage validator
        shell: bash
        run: |
          destination="$RUNNER_TEMP/retheme-native/${{ matrix.key }}"
          mkdir -p "$destination"
          cp "crates/theme-validator/target/${{ matrix.target }}/release/${{ matrix.executable }}" "$destination/${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: theme-validator-${{ matrix.key }}
          path: ${{ runner.temp }}/retheme-native
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Test and publish npm package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: theme-validator-*
          path: packages/retheme-theme-skill/native
          merge-multiple: true
      - name: Restore executable permissions
        run: chmod +x packages/retheme-theme-skill/native/{darwin-arm64,darwin-x64,linux-x64}/retheme-theme-validator
      - name: Resolve package version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME#theme-skill-v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          node - "$version" <<'NODE'
          const fs = require("node:fs");
          const path = "packages/retheme-theme-skill/package.json";
          const value = JSON.parse(fs.readFileSync(path, "utf8"));
          value.version = process.argv[2];
          fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          NODE
      - name: Verify native matrix
        shell: bash
        run: |
          test -x packages/retheme-theme-skill/native/darwin-arm64/retheme-theme-validator
          test -x packages/retheme-theme-skill/native/darwin-x64/retheme-theme-validator
          test -f packages/retheme-theme-skill/native/win32-x64/retheme-theme-validator.exe
          test -x packages/retheme-theme-skill/native/linux-x64/retheme-theme-validator
      - name: Test packed Skill
        run: pnpm test:theme-skill
      - name: Refuse an existing npm version
        shell: bash
        run: |
          version="$(node -p "require('./packages/retheme-theme-skill/package.json').version")"
          if pnpm view "@duxweb/retheme-theme-skill@$version" version >/dev/null 2>&1; then
            echo "@duxweb/retheme-theme-skill@$version is already published" >&2
            exit 1
          fi
      - name: Publish
        working-directory: packages/retheme-theme-skill
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
